name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/ProjectBrowserPlus/ProjectBrowserPlus.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectBrowserPlus-Revit2022
          path: |
            src/ProjectBrowserPlus/bin/Release/net48/ProjectBrowserPlus.dll
            src/ProjectBrowserPlus/bin/Release/net48/ProjectBrowserPlus.pdb
            src/ProjectBrowserPlus/ProjectBrowserPlus.addin
